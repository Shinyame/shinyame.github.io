<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marp Slide Presenter</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      background: #1e1e1e; 
      color: #fff; 
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
      overflow: hidden; 
    }
    
    /* コントロールバー */
    #controls { 
      padding: 10px 20px; 
      background: #111; 
      display: flex; 
      gap: 16px; 
      align-items: center; 
      z-index: 10; 
      border-bottom: 1px solid #333; 
    }
    #controls input[type="file"] { color: #ccc; }
    #controls button { 
      padding: 6px 14px; 
      background: #0066cc; 
      color: white; 
      border: none; 
      border-radius: 4px; 
      cursor: pointer; 
      font-size: 0.9em; 
    }
    #controls button:hover { background: #0052a3; }
    #controls .info { font-size: 0.85em; color: #aaa; margin-left: auto; }
    
    /* スライド表示領域 */
    #presentation-area { 
      flex: 1; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      background: #0a0a0a; 
      position: relative; 
      overflow: hidden; 
    }
    
    /* Marpスライド表示 (16:9 アスペクト比) */
    .marp-slide {
      width: 1280px;
      height: 720px;
      background: #ffffff;
      color: #24292e;
      padding: 60px 80px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: none;
      flex-direction: column;
      justify-content: center;
      position: absolute;
      font-size: 28px;
      line-height: 1.5;
      transform-origin: center center;
      border-radius: 4px;
    }
    
    .marp-slide.active { display: flex; }

    /* スライド内要素のスタイリング */
    .marp-slide h1 { font-size: 2.2em; color: #0366d6; margin-top: 0; margin-bottom: 0.4em; border-bottom: 2px solid #eff2f5; padding-bottom: 0.3em; }
    .marp-slide h2 { font-size: 1.6em; color: #24292e; margin-top: 0.6em; margin-bottom: 0.4em; }
    .marp-slide h3 { font-size: 1.3em; margin-top: 0.5em; margin-bottom: 0.3em; }
    .marp-slide p, .marp-slide li { font-size: 1em; }
    .marp-slide ul, .marp-slide ol { margin-top: 0.4em; margin-bottom: 0.8em; padding-left: 1.5em; }
    .marp-slide li { margin-bottom: 0.3em; }
    .marp-slide code { background: #f6f8fa; padding: 0.2em 0.4em; border-radius: 3px; font-family: monospace; font-size: 0.85em; color: #d73a49; }
    .marp-slide pre { background: #f6f8fa; padding: 1em; border-radius: 6px; overflow-x: auto; margin: 0.5em 0; }
    .marp-slide pre code { background: none; padding: 0; color: #24292e; }
    .marp-slide blockquote { border-left: 4px solid #0366d6; color: #6a737d; margin: 0; padding-left: 1em; }
    .marp-slide img { max-width: 100%; max-height: 400px; object-fit: contain; }
    
    /* ページ番号表示 */
    .page-number { position: absolute; bottom: 25px; right: 40px; font-size: 16px; color: #888; }
  </style>
  
  <!-- ブラウザで確実に動作する標準Markdownパーサー -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div id="controls">
    <input type="file" id="file-input" accept=".md" />
    <button id="fullscreen-btn">フルスクリーン</button>
    <span id="page-counter">0 / 0</span>
    <span class="info">操作: 左右矢印キー / スペース</span>
  </div>
  
  <div id="presentation-area">
    <!-- スライドがここに動的生成されます -->
  </div>

  <script>
    let slides = [];
    let currentIndex = 0;

    const fileInput = document.getElementById('file-input');
    const presentationArea = document.getElementById('presentation-area');
    const pageCounter = document.getElementById('page-counter');

    // 画面サイズに合わせてスライド（1280x720）を自動スケーリング
    function scaleSlides() {
      const containerWidth = presentationArea.clientWidth;
      const containerHeight = presentationArea.clientHeight;
      if (containerWidth === 0 || containerHeight === 0) return;

      const scaleX = (containerWidth - 40) / 1280;
      const scaleY = (containerHeight - 40) / 720;
      const scale = Math.min(scaleX, scaleY);
      
      const activeSlide = presentationArea.querySelector('.marp-slide.active');
      if (activeSlide) {
        activeSlide.style.transform = `scale(${scale})`;
      }
    }

    window.addEventListener('resize', scaleSlides);

    // ファイル読み込み処理
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const rawMarkdown = event.target.result;
        
        // Frontmatter (先頭のヘッダーブロック) を除去
        let cleanMarkdown = rawMarkdown.replace(/^---[\s\S]*?---\n?/, '');
        
        // Marpのスライド区切り `---` で分割
        const slideTexts = cleanMarkdown.split(/^---$/m);
        
        presentationArea.innerHTML = '';
        
        slideTexts.forEach((text, index) => {
          // Marp固有のHTMLコメントディレクティブ (<!-- _class: lead -->等) を除去
          const cleanText = text.replace(/<!--[\s\S]*?-->/g, '').trim();
          
          const slideDiv = document.createElement('div');
          slideDiv.className = 'marp-slide';
          
          // MarkdownからHTMLを生成
          const htmlContent = marked.parse(cleanText);
          slideDiv.innerHTML = htmlContent + `<div class="page-number">${index + 1} / ${slideTexts.length}</div>`;
          
          presentationArea.appendChild(slideDiv);
        });

        slides = Array.from(presentationArea.querySelectorAll('.marp-slide'));
        currentIndex = 0;
        updateSlideVisibility();
      };
      reader.readAsText(file);
    });

    // スライドの表示更新
    function updateSlideVisibility() {
      slides.forEach((slide, index) => {
        if (index === currentIndex) {
          slide.classList.add('active');
        } else {
          slide.classList.remove('active');
        }
      });
      scaleSlides();
      if (slides.length > 0) {
        pageCounter.textContent = `${currentIndex + 1} / ${slides.length}`;
      }
    }

    // キーボード操作
    window.addEventListener('keydown', (e) => {
      if (slides.length === 0) return;
      
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        if (currentIndex < slides.length - 1) {
          currentIndex++;
          updateSlideVisibility();
        }
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        if (currentIndex > 0) {
          currentIndex--;
          updateSlideVisibility();
        }
      }
    });

    // フルスクリーン機能
    document.getElementById('fullscreen-btn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        presentationArea.requestFullscreen().then(() => {
          setTimeout(scaleSlides, 100);
        });
      } else {
        document.exitFullscreen();
      }
    });
  </script>
</body>
</html>
