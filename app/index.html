<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Directory | Shinyame Portfolio</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    /* =========================================
       Theme Tokens (Light & Dark)
       ========================================= */
    :root {
      --md-sys-color-primary: #6750A4;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #EADDFF;
      --md-sys-color-on-primary-container: #21005D;
      --md-sys-color-surface: #FEF7FF;
      --md-sys-color-surface-container: #F3EDF7;
      --md-sys-color-surface-container-high: #ECE6F0;
      --md-sys-color-on-surface: #1D1B20;
      --md-sys-color-on-surface-variant: #49454F;
      --md-sys-color-outline: #79747E;
      --md-sys-color-outline-variant: #CAC4D0;
      --md-shape-corner: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --md-sys-color-primary: #D0BCFF;
        --md-sys-color-on-primary: #381E72;
        --md-sys-color-primary-container: #4F378B;
        --md-sys-color-on-primary-container: #EADDFF;
        --md-sys-color-surface: #141218;
        --md-sys-color-surface-container: #211F26;
        --md-sys-color-surface-container-high: #2B2930;
        --md-sys-color-on-surface: #E6E0E9;
        --md-sys-color-on-surface-variant: #CAC4D0;
        --md-sys-color-outline: #938F99;
        --md-sys-color-outline-variant: #49454F;
      }
    }

    :root[data-theme="dark"] {
      --md-sys-color-primary: #D0BCFF;
      --md-sys-color-on-primary: #381E72;
      --md-sys-color-primary-container: #4F378B;
      --md-sys-color-on-primary-container: #EADDFF;
      --md-sys-color-surface: #141218;
      --md-sys-color-surface-container: #211F26;
      --md-sys-color-surface-container-high: #2B2930;
      --md-sys-color-on-surface: #E6E0E9;
      --md-sys-color-on-surface-variant: #CAC4D0;
      --md-sys-color-outline: #938F99;
      --md-sys-color-outline-variant: #49454F;
    }

    /* =========================================
       Base & Layout
       ========================================= */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      min-height: 100vh;
      display: flex; flex-direction: column;
      transition: background 0.2s, color 0.2s;
    }

    header {
      background: var(--md-sys-color-surface-container);
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      position: sticky; top: 0; z-index: 100;
    }
    .header-container {
      max-width: 1200px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center;
    }

    .brand { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: inherit; }
    .brand-icon {
      background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container);
      width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
    }
    .brand-title { font-size: 1.25rem; font-weight: 700; }

    .theme-toggle-btn {
      display: flex; align-items: center; gap: 0.5rem;
      background: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-on-surface);
      border: 1px solid var(--md-sys-color-outline-variant); border-radius: 20px;
      padding: 0.4rem 0.85rem; font-family: inherit; font-weight: 600; cursor: pointer;
      transition: 0.2s;
    }
    .theme-toggle-btn:hover {
      background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container);
      border-color: var(--md-sys-color-primary);
    }
    .theme-toggle-btn span.material-symbols-outlined { font-size: 18px; }

    main { flex: 1; max-width: 1200px; width: 100%; margin: 0 auto; padding: 2.5rem 1.5rem; }
    .hero-title { font-size: 2.25rem; font-weight: 700; margin-bottom: 0.5rem; }
    .hero-subtitle { color: var(--md-sys-color-on-surface-variant); margin-bottom: 1.5rem; }

    /* =========================================
       Components
       ========================================= */
    .search-box { position: relative; max-width: 500px; margin-bottom: 2.5rem; }
    .search-box span { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--md-sys-color-outline); }
    .search-input {
      width: 100%; padding: 0.875rem 1rem 0.875rem 3rem;
      border-radius: 28px; border: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-high); color: inherit; font-size: 1rem; outline: none; transition: 0.2s;
    }
    .search-input:focus { border-color: var(--md-sys-color-primary); box-shadow: 0 0 0 3px var(--md-sys-color-primary-container); }

    .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
    .app-card {
      background: var(--md-sys-color-surface-container); border-radius: var(--md-shape-corner);
      padding: 1.5rem; border: 1px solid var(--md-sys-color-outline-variant);
      display: flex; flex-direction: column; justify-content: space-between;
      text-decoration: none; color: inherit; transition: 0.2s;
    }
    .app-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.08); border-color: var(--md-sys-color-primary); }

    .app-card-header { display: flex; gap: 1rem; margin-bottom: 1rem; }
    .app-icon {
      width: 48px; height: 48px; border-radius: 12px; background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container); display: grid; place-items: center; flex-shrink: 0;
    }
    .app-title-group { flex: 1; overflow: hidden; }
    .app-name { font-size: 1.15rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .app-path { font-size: 0.8rem; font-family: monospace; color: var(--md-sys-color-outline); }
    .app-desc { font-size: 0.9rem; color: var(--md-sys-color-on-surface-variant); margin-bottom: 1.5rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .app-card-footer { display: flex; justify-content: space-between; border-top: 1px solid var(--md-sys-color-outline-variant); padding-top: 0.75rem; }
    .app-tag { font-size: 0.75rem; padding: 0.25rem 0.6rem; border-radius: 12px; background: var(--md-sys-color-surface-container-high); color: var(--md-sys-color-on-surface-variant); font-weight: 500; }
    .launch-btn { display: flex; align-items: center; gap: 0.25rem; font-size: 0.875rem; font-weight: 600; color: var(--md-sys-color-primary); }

    .status-msg { grid-column: 1 / -1; text-align: center; padding: 4rem 1rem; color: var(--md-sys-color-outline); }
    .status-msg .material-symbols-outlined { font-size: 48px; margin-bottom: 1rem; }
    
    footer { text-align: center; padding: 2rem; border-top: 1px solid var(--md-sys-color-outline-variant); color: var(--md-sys-color-outline); font-size: 0.875rem; margin-top: auto; }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <a href="../" class="brand">
        <div class="brand-icon"><span class="material-symbols-outlined">apps</span></div>
        <span class="brand-title">Shinyame Apps</span>
      </a>
      <button id="themeBtn" class="theme-toggle-btn" aria-label="テーマ切替">
        <span id="themeIcon" class="material-symbols-outlined">brightness_auto</span>
        <span id="themeLabel">Auto</span>
      </button>
    </div>
  </header>

  <main>
    <section class="hero-section">
      <h1 class="hero-title">Applications Hub</h1>
      <p class="hero-subtitle">ポートフォリオ内で公開しているWebツールおよびアプリケーション一覧</p>
      
      <div class="search-box">
        <span class="material-symbols-outlined">search</span>
        <input type="text" id="searchInput" class="search-input" placeholder="アプリ名・キーワード検索...">
      </div>
    </section>

    <div id="appGrid" class="app-grid">
      <!-- Initial Loading State -->
    </div>
  </main>

  <footer>
    <p>&copy; Shinyame. Hosted on GitHub Pages.</p>
  </footer>

  <script>
    // --- DOM Elements ---
    const UI = {
      grid: document.getElementById("appGrid"),
      search: document.getElementById("searchInput"),
      themeBtn: document.getElementById("themeBtn"),
      themeIcon: document.getElementById("themeIcon"),
      themeLabel: document.getElementById("themeLabel")
    };

    // --- 1. Theme Controller ---
    const THEMES = [
      { mode: 'auto', icon: 'brightness_auto', label: 'Auto' },
      { mode: 'light', icon: 'light_mode', label: 'Light' },
      { mode: 'dark', icon: 'dark_mode', label: 'Dark' }
    ];
    
    let themeIdx = THEMES.findIndex(t => t.mode === (localStorage.getItem('theme_mode') || 'auto'));

    const applyTheme = () => {
      const { mode, icon, label } = THEMES[themeIdx];
      localStorage.setItem('theme_mode', mode);
      mode === 'auto' ? document.documentElement.removeAttribute('data-theme') 
                      : document.documentElement.setAttribute('data-theme', mode);
      UI.themeIcon.textContent = icon;
      UI.themeLabel.textContent = label;
    };

    UI.themeBtn.addEventListener('click', () => {
      themeIdx = (themeIdx + 1) % THEMES.length;
      applyTheme();
    });
    applyTheme();

    // --- 2. App Fetcher & Renderer ---
    const REPO = "Shinyame/shinyame.github.io";
    let appsData = [];

    const showMsg = (icon, text) => {
      UI.grid.innerHTML = `<div class="status-msg"><span class="material-symbols-outlined">${icon}</span><p>${text}</p></div>`;
    };

    const renderApps = (apps) => {
      if (!apps.length) return showMsg('search_off', '該当するアプリが見つかりません。');
      UI.grid.innerHTML = apps.map(app => `
        <a href="${app.url}" class="app-card">
          <div>
            <div class="app-card-header">
              <div class="app-icon"><span class="material-symbols-outlined">${app.icon}</span></div>
              <div class="app-title-group">
                <div class="app-name">${app.name}</div>
                <div class="app-path">/app/${app.dir}</div>
              </div>
            </div>
            <p class="app-desc">${app.desc}</p>
          </div>
          <div class="app-card-footer">
            <span class="app-tag">${app.tag}</span>
            <span class="launch-btn">開く<span class="material-symbols-outlined" style="font-size: 16px;">arrow_forward</span></span>
          </div>
        </a>
      `).join('');
    };

    const fetchApps = async () => {
      showMsg('hourglass_empty', '読み込み中...');
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO}/contents/app`);
        if (!res.ok) throw new Error(res.status);

        const dirs = (await res.json()).filter(i => i.type === "dir");
        if (!dirs.length) return showMsg('folder_open', '公開中のアプリがありません。');

        const icons = ["widgets", "build", "terminal", "code", "space_dashboard", "tune"];
        appsData = dirs.map((d, i) => ({
          dir: d.name,
          name: d.name.replace(/[-_]/g, ' ').replace(/\b\w/g, l => l.toUpperCase()),
          desc: `Web Application (${d.name})`,
          icon: icons[i % icons.length],
          tag: "Web App",
          url: `./${d.name}/`
        }));
        
        renderApps(appsData);
      } catch (err) {
        showMsg('cloud_off', '読み込みに失敗しました。');
      }
    };

    // --- 3. Search Filter ---
    UI.search.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      renderApps(appsData.filter(a => 
        [a.name, a.dir, a.desc].some(text => text.toLowerCase().includes(q))
      ));
    });

    // Initialize
    fetchApps();
  </script>
</body>
</html>
