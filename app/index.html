<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Directory | Shinyame Portfolio</title>
  
  <!-- Material Symbols & Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    /* Material Design 3 Design Tokens (Light Theme Default) */
    :root {
      --md-sys-color-primary: #6750A4;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #EADDFF;
      --md-sys-color-on-primary-container: #21005D;
      --md-sys-color-surface: #FEF7FF;
      --md-sys-color-surface-container: #F3EDF7;
      --md-sys-color-surface-container-high: #ECE6F0;
      --md-sys-color-on-surface: #1D1B20;
      --md-sys-color-on-surface-variant: #49454F;
      --md-sys-color-outline: #79747E;
      --md-sys-color-outline-variant: #CAC4D0;
      --md-shape-corner-large: 16px;
      --md-shape-corner-extra-large: 28px;
    }

    /* Dark Theme Tokens (OS設定 or 手動切り替え用) */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --md-sys-color-primary: #D0BCFF;
        --md-sys-color-on-primary: #381E72;
        --md-sys-color-primary-container: #4F378B;
        --md-sys-color-on-primary-container: #EADDFF;
        --md-sys-color-surface: #141218;
        --md-sys-color-surface-container: #211F26;
        --md-sys-color-surface-container-high: #2B2930;
        --md-sys-color-on-surface: #E6E0E9;
        --md-sys-color-on-surface-variant: #CAC4D0;
        --md-sys-color-outline: #938F99;
        --md-sys-color-outline-variant: #49454F;
      }
    }

    /* 手動でDarkに設定されている場合 */
    :root[data-theme="dark"] {
      --md-sys-color-primary: #D0BCFF;
      --md-sys-color-on-primary: #381E72;
      --md-sys-color-primary-container: #4F378B;
      --md-sys-color-on-primary-container: #EADDFF;
      --md-sys-color-surface: #141218;
      --md-sys-color-surface-container: #211F26;
      --md-sys-color-surface-container-high: #2B2930;
      --md-sys-color-on-surface: #E6E0E9;
      --md-sys-color-on-surface-variant: #CAC4D0;
      --md-sys-color-outline: #938F99;
      --md-sys-color-outline-variant: #49454F;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Top Navigation Bar */
    header {
      background-color: var(--md-sys-color-surface-container);
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--md-sys-color-outline-variant);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--md-sys-color-on-surface);
    }

    .brand-icon {
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
    }

    /* Theme Toggle Button */
    .theme-toggle-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: 20px;
      padding: 0.4rem 0.85rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .theme-toggle-btn:hover {
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      border-color: var(--md-sys-color-primary);
    }

    .theme-toggle-btn .material-symbols-outlined {
      font-size: 18px;
    }

    /* Main Layout */
    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
    }

    .hero-section {
      margin-bottom: 2.5rem;
    }

    .hero-title {
      font-size: 2.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .hero-subtitle {
      color: var(--md-sys-color-on-surface-variant);
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }

    /* Search Input Box */
    .search-box {
      position: relative;
      max-width: 500px;
    }

    .search-box span {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--md-sys-color-outline);
    }

    .search-input {
      width: 100%;
      padding: 0.875rem 1rem 0.875rem 3rem;
      border-radius: var(--md-shape-corner-extra-large);
      border: 1px solid var(--md-sys-color-outline-variant);
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface);
      font-size: 1rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--md-sys-color-primary);
      box-shadow: 0 0 0 3px var(--md-sys-color-primary-container);
    }

    /* App Grid Layout */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    /* Material 3 Card Component */
    .app-card {
      background: var(--md-sys-color-surface-container);
      border-radius: var(--md-shape-corner-large);
      padding: 1.5rem;
      border: 1px solid var(--md-sys-color-outline-variant);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.2s cubic-bezier(0.2, 0, 0, 1), border-color 0.2s ease;
    }

    .app-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
      border-color: var(--md-sys-color-primary);
    }

    .app-card-header {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .app-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .app-title-group {
      flex: 1;
      overflow: hidden;
    }

    .app-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--md-sys-color-on-surface);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-path {
      font-size: 0.8rem;
      font-family: monospace;
      color: var(--md-sys-color-outline);
    }

    .app-desc {
      font-size: 0.9rem;
      color: var(--md-sys-color-on-surface-variant);
      margin-bottom: 1.5rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .app-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      padding-top: 0.75rem;
    }

    .app-tag {
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
      background: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
      font-weight: 500;
    }

    .launch-btn {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--md-sys-color-primary);
    }

    /* Status State */
    .status-container {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--md-sys-color-outline);
    }

    .status-icon {
      font-size: 48px;
      margin-bottom: 1rem;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 2rem;
      border-top: 1px solid var(--md-sys-color-outline-variant);
      color: var(--md-sys-color-outline);
      font-size: 0.875rem;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <a href="../" class="brand">
        <div class="brand-icon">
          <span class="material-symbols-outlined">apps</span>
        </div>
        <span class="brand-title">Shinyame Applications</span>
      </a>

      <!-- Theme Switcher Toggle -->
      <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="テーマ切替">
        <span class="material-symbols-outlined" id="themeIcon">brightness_auto</span>
        <span id="themeLabel">Auto</span>
      </button>
    </div>
  </header>

  <main>
    <section class="hero-section">
      <h1 class="hero-title">Applications Hub</h1>
      <p class="hero-subtitle">ポートフォリオ内で公開しているWebツールおよびアプリケーション一覧</p>
      
      <div class="search-box">
        <span class="material-symbols-outlined">search</span>
        <input type="text" id="searchInput" class="search-input" placeholder="アプリ名・キーワード検索..." oninput="filterApps()">
      </div>
    </section>

    <div id="appGrid" class="app-grid">
      <div class="status-container">
        <span class="material-symbols-outlined status-icon">hourglass_empty</span>
        <p>アプリケーション一覧を読み込んでいます...</p>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; Shinyame. Hosted on GitHub Pages.</p>
  </footer>

  <script>
    // --- Theme Controller Logic ---
    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const themeIcon = document.getElementById("themeIcon");
    const themeLabel = document.getElementById("themeLabel");

    const THEME_MODES = ['auto', 'light', 'dark'];
    const THEME_CONFIG = {
      auto: { icon: 'brightness_auto', label: 'Auto' },
      light: { icon: 'light_mode', label: 'Light' },
      dark: { icon: 'dark_mode', label: 'Dark' }
    };

    let currentThemeMode = localStorage.getItem('theme_mode') || 'auto';

    function applyTheme(mode) {
      currentThemeMode = mode;
      localStorage.setItem('theme_mode', mode);

      if (mode === 'auto') {
        document.documentElement.removeAttribute('data-theme');
      } else {
        document.documentElement.setAttribute('data-theme', mode);
      }

      const config = THEME_CONFIG[mode];
      themeIcon.textContent = config.icon;
      themeLabel.textContent = config.label;
    }

    themeToggleBtn.addEventListener('click', () => {
      const currentIndex = THEME_MODES.indexOf(currentThemeMode);
      const nextIndex = (currentIndex + 1) % THEME_MODES.length;
      applyTheme(THEME_MODES[nextIndex]);
    });

    // 初期化実行
    applyTheme(currentThemeMode);

    // --- App Fetcher & Renderer ---
    const APP_METADATA = {};
    const DEFAULT_ICONS = ["widgets", "build", "terminal", "code", "space_dashboard", "tune", "extension"];
    const REPO_OWNER = "Shinyame";
    const REPO_NAME = "shinyame.github.io";
    const APP_DIR_PATH = "app";

    let allApps = [];

    async function fetchApps() {
      const grid = document.getElementById("appGrid");
      try {
        const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${APP_DIR_PATH}`);
        if (!response.ok) throw new Error(`GitHub API Error: ${response.status}`);

        const files = await response.json();
        const directories = files.filter(item => item.type === "dir");

        if (directories.length === 0) {
          grid.innerHTML = `
            <div class="status-container">
              <span class="material-symbols-outlined status-icon">folder_open</span>
              <p>配下に公開中のアプリケーションが見つかりませんでした。</p>
            </div>
          `;
          return;
        }

        allApps = directories.map((dir, index) => {
          const custom = APP_METADATA[dir.name] || {};
          return {
            dirName: dir.name,
            name: custom.name || formatTitle(dir.name),
            desc: custom.desc || `Web Application (${dir.name})`,
            icon: custom.icon || DEFAULT_ICONS[index % DEFAULT_ICONS.length],
            tag: custom.tag || "Web App",
            url: `./${dir.name}/`
          };
        });

        renderApps(allApps);

      } catch (err) {
        console.warn("GitHub APIからの自動読み込みに失敗しました:", err);
        grid.innerHTML = `
          <div class="status-container">
            <span class="material-symbols-outlined status-icon">cloud_off</span>
            <p>アプリ一覧の読み込みに失敗しました。</p>
          </div>
        `;
      }
    }

    function formatTitle(str) {
      return str.replace(/[-_]/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
    }

    function renderApps(apps) {
      const grid = document.getElementById("appGrid");
      if (apps.length === 0) {
        grid.innerHTML = `
          <div class="status-container">
            <span class="material-symbols-outlined status-icon">search_off</span>
            <p>条件に一致するアプリが見つかりません。</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = apps.map(app => `
        <a href="${app.url}" class="app-card">
          <div>
            <div class="app-card-header">
              <div class="app-icon">
                <span class="material-symbols-outlined">${app.icon}</span>
              </div>
              <div class="app-title-group">
                <div class="app-name">${app.name}</div>
                <div class="app-path">/app/${app.dirName}</div>
              </div>
            </div>
            <p class="app-desc">${app.desc}</p>
          </div>
          <div class="app-card-footer">
            <span class="app-tag">${app.tag}</span>
            <span class="launch-btn">
              開く
              <span class="material-symbols-outlined" style="font-size: 16px;">arrow_forward</span>
            </span>
          </div>
        </a>
      `).join('');
    }

    function filterApps() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = allApps.filter(app => 
        app.name.toLowerCase().includes(query) ||
        app.dirName.toLowerCase().includes(query) ||
        app.desc.toLowerCase().includes(query)
      );
      renderApps(filtered);
    }

    fetchApps();
  </script>
</body>
</html>
